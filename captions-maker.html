
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipAI Auto Captions</title>
<style>
body {
  margin: 0;
  padding: 15px;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 600px;
  margin: auto;
}
h1 {
  text-align: center;
  color: #b45cff;
}
.card {
  background: #171923;
  border: 1px solid #343545;
  border-radius: 18px;
  padding: 18px;
  margin: 18px 0;
}
button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #a347ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
}
video {
  width: 100%;
  margin-top: 12px;
  border-radius: 12px;
  background: black;
}
textarea {
  width: 100%;
  min-height: 140px;
  box-sizing: border-box;
  background: #242632;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
}
.status {
  color: #c18aff;
  text-align: center;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">

<h1>🎬 ClipAI Auto Captions</h1>

<div class="card">
<h3>1. Upload Video</h3>
<input type="file" id="file" accept="video/*">
<video id="video" controls></video>
</div>

<div class="card">
<h3>2. Add Captions</h3>
<p>Har line mein apna caption likho.</p>
<textarea id="captions" placeholder="Example:
I am the king of my life
Never give up
Keep moving forward"></textarea>

<button onclick="addCaptions()">✨ Add Captions</button>
</div>

<div class="card">
<h3>3. Caption Preview</h3>
<div id="preview" style="background:black;padding:25px;text-align:center;border-radius:12px;font-size:22px;font-weight:bold;">
Your caption will appear here
</div>
<button onclick="downloadCaptions()">📥 Download Captions</button>
</div>

<div class="status" id="status"></div>

</div>

<script>
const file = document.getElementById("file");
const video = document.getElementById("video");
const captions = document.getElementById("captions");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

file.onchange = () => {
  if (file.files[0]) {
    video.src = URL.createObjectURL(file.files[0]);
    status.innerText = "Video loaded successfully ✅";
  }
};

function addCaptions() {
  const lines = captions.value.split("\n").filter(x => x.trim());
  if (!lines.length) {
    status.innerText = "Please write captions first.";
    return;
  }

  preview.innerHTML = lines.map(line =>
    `<div style="margin:10px 0;color:white;text-shadow:2px 2px 4px black;">${escapeHTML(line)}</div>`
  ).join("");

  status.innerText = "Captions preview ready ✅";
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(m) {
    return ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[m];
  });
}

function downloadCaptions() {
  const text = captions.value.trim();
  if (!text) {
    status.innerText = "Please add captions first.";
    return;
  }

  const blob = new Blob([text], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ClipAI-Captions.txt";
  a.click();

  status.innerText = "Captions downloaded ✅";
}
</script>
</body>
</html>
