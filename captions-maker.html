<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipAI Auto Captions</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;background:#090b12;color:white;
 font-family:Arial,sans-serif
}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#b45cff}
.card{
 background:#171923;border:1px solid #343545;
 border-radius:18px;padding:18px;margin:18px 0
}
h2{font-size:22px}
input,textarea,select{
 width:100%;padding:14px;margin-top:10px;
 border-radius:12px;border:1px solid #555;
 background:#242632;color:white;font-size:16px
}
textarea{min-height:180px;resize:vertical}
button{
 width:100%;padding:16px;border:0;border-radius:12px;
 background:#a347ff;color:white;font-size:17px;
 font-weight:bold;margin-top:12px;cursor:pointer
}
button:disabled{opacity:.6}
video{width:100%;margin-top:12px;border-radius:12px;background:black}
.preview{
 background:black;border-radius:12px;padding:20px;
 min-height:140px;text-align:center;white-space:pre-wrap;
 overflow-wrap:anywhere;font-size:20px;font-weight:bold
}
.status{text-align:center;color:#c18aff;margin:15px}
.small{color:#aaa;font-size:14px}
</style>
</head>

<body>
<div class="container">

<h1>🎬 ClipAI Auto Captions</h1>

<div class="card">
<h2>1. Upload Video</h2>
<input type="file" id="file" accept="video/*">
<video id="video" controls></video>
</div>

<div class="card">
<h2>2. Video Transcript</h2>
<p>Video ki boli hui baat yahan paste karein.</p>

<select id="language">
<option value="Hindi">Hindi</option>
<option value="Hinglish">Hinglish</option>
<option value="English">English</option>
<option value="Urdu">Urdu</option>
</select>

<textarea id="transcript"
placeholder="Video mein jo bola gaya hai, yahan paste karein..."></textarea>

<button id="generate" onclick="generateAI()">
🤖 Generate AI Captions
</button>
</div>

<div class="card">
<h2>3. AI Result</h2>
<div id="result" class="preview">
AI result yahan appear hoga...
</div>
<button onclick="downloadResult()">⬇️ Download Result</button>
<button onclick="copyResult()">📋 Copy Result</button>
</div>

<div id="status" class="status"></div>
<p class="small" style="text-align:center">
ClipAI Studio • AI content assistant
</p>

</div>

<script>
const file = document.getElementById("file");
const video = document.getElementById("video");
const transcript = document.getElementById("transcript");
const result = document.getElementById("result");
const status = document.getElementById("status");
const generateBtn = document.getElementById("generate");

file.onchange = () => {
 if(file.files[0]){
  video.src = URL.createObjectURL(file.files[0]);
  status.innerText = "Video loaded successfully ✅";
 }
};

async function generateAI(){

 const text = transcript.value.trim();

 if(!text){
  status.innerText = "Pehle video ka transcript paste karein ⚠️";
  transcript.focus();
  return;
 }

 generateBtn.disabled = true;
 generateBtn.innerText = "⏳ AI is working...";
 status.innerText = "AI content generate ho raha hai...";

 try{

  const response = await fetch("/api/captions",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    videoTitle:file.files[0]?.name || "My Video",
    captions:text,
    language:document.getElementById("language").value
   })
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "AI request failed");
  }

  result.innerText =
   data.result ||
   data.text ||
   data.output ||
   JSON.stringify(data,null,2);

  status.innerText = "AI captions generated successfully ✅";

 }catch(error){

  result.innerText = "Error: " + error.message;
  status.innerText = "AI generate nahi hua ❌";

 }finally{

  generateBtn.disabled = false;
  generateBtn.innerText = "🤖 Generate AI Captions";
 }
}

function downloadResult(){

 const text = result.innerText.trim();

 if(!text || text.includes("AI result yahan")){
  status.innerText = "Pehle AI result generate karein ⚠️";
  return;
 }

 const blob = new Blob([text],{type:"text/plain"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");

 a.href = url;
 a.download = "ClipAI-Captions.txt";
 a.click();

 URL.revokeObjectURL(url);
 status.innerText = "Download started ✅";
}

async function copyResult(){

 const text = result.innerText;

 if(!text || text.includes("AI result yahan")){
  status.innerText = "Pehle AI result generate karein ⚠️";
  return;
 }

 try{
  await navigator.clipboard.writeText(text);
  status.innerText = "Copied successfully ✅";
 }catch(e){
  status.innerText = "Copy nahi hua, manually select karein.";
 }
}
</script>

</body>
</html>
