
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipAI Shorts Maker 2</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1020;
 color:white;
 font-family:Arial,sans-serif;
 padding:16px
}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#7c8cff}
.card{
 background:#171e32;
 padding:18px;
 border-radius:18px;
 margin-top:15px
}
label{
 display:block;
 margin-top:15px;
 color:#bdc8ff
}
input,button{
 width:100%;
 padding:13px;
 margin-top:8px;
 border-radius:10px;
 border:none;
 font-size:16px
}
button{
 background:#6879ff;
 color:white;
 font-weight:bold
}
button:disabled{opacity:.5}
.preview{
 width:100%;
 max-width:350px;
 aspect-ratio:9/16;
 margin:18px auto;
 background:#000;
 position:relative;
 overflow:hidden;
 border-radius:14px
}
video{
 width:100%;
 height:100%;
 object-fit:cover
}
.overlay{
 position:absolute;
 left:5%;
 right:5%;
 top:50%;
 transform:translateY(-50%);
 text-align:center;
 color:white;
 font-size:30px;
 font-weight:bold;
 text-shadow:2px 2px 6px black,0 0 10px black;
 word-wrap:break-word;
 pointer-events:none
}
.time{
 display:flex;
 justify-content:space-between;
 color:#aab5ff;
 margin-top:5px
}
.status{text-align:center;color:#aab5ff;margin:14px}
.small{font-size:13px;color:#aab5ff}
</style>
</head>

<body>
<div class="container">
<h1>🎬 ClipAI Shorts Maker 2</h1>

<div class="card">

<label>Upload Video</label>
<input type="file" id="file" accept="video/*">

<div class="preview">
 <video id="video" playsinline controls></video>
 <div class="overlay" id="overlay"></div>
</div>

<label>Start Time</label>
<input type="range" id="startSlider" min="0" max="30" value="0" step="0.1">
<div class="time">
 <span>Start: <b id="startLabel">0.0</b>s</span>
</div>
<input type="number" id="startInput" value="0" min="0" step="0.1">

<label>End Time</label>
<input type="range" id="endSlider" min="0" max="30" value="15" step="0.1">
<div class="time">
 <span>End: <b id="endLabel">15.0</b>s</span>
</div>
<input type="number" id="endInput" value="15" min="0" step="0.1">

<button id="setStart">⏮ Set Start From Video</button>
<button id="setEnd">⏭ Set End From Video</button>

<label>Text on Video</label>
<input type="text" id="textInput" placeholder="Write your Shorts title here">

<label>Text Size</label>
<input type="range" id="textSize" min="18" max="48" value="30">
<div class="time">
 <span>Small</span><span>Large</span>
</div>

<button id="previewBtn">▶ Preview Clip</button>
<button id="exportBtn">📥 Export Shorts</button>

<div class="status" id="status">Upload a video to begin</div>
<p class="small">Export format: WebM • Vertical 9:16</p>

</div>
</div>

<script>
const fileInput=document.getElementById("file");
const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const startSlider=document.getElementById("startSlider");
const endSlider=document.getElementById("endSlider");
const startInput=document.getElementById("startInput");
const endInput=document.getElementById("endInput");
const startLabel=document.getElementById("startLabel");
const endLabel=document.getElementById("endLabel");
const textInput=document.getElementById("textInput");
const textSize=document.getElementById("textSize");
const statusBox=document.getElementById("status");
const previewBtn=document.getElementById("previewBtn");
const exportBtn=document.getElementById("exportBtn");

let videoURL=null;
let previewStop=null;

function setStatus(text){
 statusBox.textContent=text;
}

function updateStart(value){
 let v=Math.max(0,Number(value)||0);
 if(video.duration && v>=video.duration)v=Math.max(0,video.duration-0.1);
 startSlider.value=v;
 startInput.value=v;
 startLabel.textContent=Number(v).toFixed(1);
 if(Number(endSlider.value)<=v){
  let newEnd=Math.min(video.duration||30,v+1);
  endSlider.value=newEnd;
  endInput.value=newEnd;
  endLabel.textContent=Number(newEnd).toFixed(1);
 }
}

function updateEnd(value){
 let v=Math.max(0,Number(value)||0);
 if(video.duration && v>video.duration)v=video.duration;
 if(v<=Number(startSlider.value)){
  v=Number(startSlider.value)+0.1;
 }
 endSlider.value=v;
 endInput.value=v;
 endLabel.textContent=Number(v).toFixed(1);
}

startSlider.oninput=()=>updateStart(startSlider.value);
startInput.onchange=()=>updateStart(startInput.value);
endSlider.oninput=()=>updateEnd(endSlider.value);
endInput.onchange=()=>updateEnd(endInput.value);

textInput.oninput=()=>overlay.textContent=textInput.value;
textSize.oninput=()=>overlay.style.fontSize=textSize.value+"px";

fileInput.onchange=()=>{
 const file=fileInput.files[0];
 if(!file)return;

 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 video.src=videoURL;

 video.onloadedmetadata=()=>{
  const duration=video.duration;
  startSlider.max=duration;
  endSlider.max=duration;
  startSlider.value=0;
  startInput.value=0;
  startLabel.textContent="0.0";
  const end=Math.min(15,duration);
  endSlider.value=end;
  endInput.value=end;
  endLabel.textContent=Number(end).toFixed(1);
  setStatus("Video loaded successfully ✅");
 };
};

document.getElementById("setStart").onclick=()=>{
 updateStart(video.currentTime);
};

document.getElementById("setEnd").onclick=()=>{
 updateEnd(video.currentTime);
};

previewBtn.onclick=()=>{
 const start=Number(startSlider.value);
 const end=Number(endSlider.value);

 if(!video.src){alert("Upload a video first");return}
 if(end<=start){alert("End time must be after Start time");return}

 if(previewStop)video.removeEventListener("timeupdate",previewStop);

 video.currentTime=start;
 video.play();

 previewStop=()=>{
  if(video.currentTime>=end){
   video.pause();
   video.removeEventListener("timeupdate",previewStop);
  }
 };
 video.addEventListener("timeupdate",previewStop);
 setStatus("Preview playing...");
};

exportBtn.onclick=async()=>{
 if(!video.src){alert("Upload a video first");return}

 const start=Number(startSlider.value);
 const end=Number(endSlider.value);

 if(end<=start){alert("End time must be after Start time");return}

 if(!window.MediaRecorder){
  alert("Export is not supported in this browser");
  return;
 }

 exportBtn.disabled=true;
 previewBtn.disabled=true;
 setStatus("Preparing export...");

 try{
  video.pause();
  video.currentTime=start;

  await new Promise(resolve=>{
   video.onseeked=resolve;
  });

  const canvas=document.createElement("canvas");
  canvas.width=720;
  canvas.height=1280;
  const ctx=canvas.getContext("2d");

  const stream=canvas.captureStream(30);

  // Attempt to include original audio
  try{
   const audioStream=video.captureStream();
   audioStream.getAudioTracks().forEach(track=>{
    stream.addTrack(track);
   });
  }catch(e){
   console.log("Audio capture unavailable");
  }

  let mime="video/webm";
  if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")){
   mime="video/webm;codecs=vp9";
  }else if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")){
   mime="video/webm;codecs=vp8";
  }

  const recorder=new MediaRecorder(stream,{mimeType:mime});
  const chunks=[];

  recorder.ondataavailable=e=>{
   if(e.data && e.data.size>0)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:"video/webm"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;
   a.download="clipai-shorts-2.webm";
   document.body.appendChild(a);
   a.click();
   a.remove();

   setStatus("Export complete! Download started ✅");
   exportBtn.disabled=false;
   previewBtn.disabled=false;
  };

  const scale=()=>{
   const vw=video.videoWidth;
   const vh=video.videoHeight;
   if(!vw||!vh)return;

   const s=Math.max(canvas.width/vw,canvas.height/vh);
   const w=vw*s;
   const h=vh*s;

   ctx.fillStyle="#000";
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(video,(canvas.width-w)/2,(canvas.height-h)/2,w,h);

   const txt=textInput.value.trim();
   if(txt){
    const size=Number(textSize.value);
    ctx.font="bold "+size+"px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    const lines=txt.split("\n");
    const lineHeight=size*1.25;
    const totalHeight=lines.length*lineHeight;
    const y=canvas.height/2-totalHeight/2+lineHeight/2;

    ctx.lineWidth=5;
    ctx.strokeStyle="#000";
    ctx.fillStyle="#fff";

    lines.forEach((line,i)=>{
     ctx.strokeText(line,canvas.width/2,y+i*lineHeight,canvas.width*0.9);
     ctx.fillText(line,canvas.width/2,y+i*lineHeight,canvas.width*0.9);
    });
   }
  };

  recorder.start();
  video.currentTime=start;
  await video.play();

  setStatus("Exporting... Please wait");

  function drawFrame(){
   scale();

   if(video.currentTime>=end){
    video.pause();
    recorder.stop();
    return;
   }
   requestAnimationFrame(drawFrame);
  }

  drawFrame();

 }catch(err){
  console.error(err);
  setStatus("Export failed: "+err.message);
  exportBtn.disabled=false;
  previewBtn.disabled=false;
 }
};
</script>
</body>
</html>
